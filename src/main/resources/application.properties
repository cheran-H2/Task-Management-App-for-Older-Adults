spring.application.name=task-management-app
server.port=8080

# Default Datasource: Embedded H2 in MySQL Compatibility Mode
# Allows instant local execution without requiring MySQL password setup
spring.datasource.url=jdbc:h2:file:./data/eldercare_tasks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Static content location
spring.web.resources.static-locations=classpath:/static/
